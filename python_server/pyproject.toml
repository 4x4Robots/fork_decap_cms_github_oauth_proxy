[project]
name = "decap-cms-github-oauth-proxy"
version = "1.0.0"
description = "GitHub OAuth2 proxy server for Decap CMS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "itsdangerous>=2.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.52.1",
]

# For uv, we'll use the dependencies directly without building a package
[tool.uv]
# This tells uv to treat this as an application, not a library
# We'll use the dependencies from requirements.txt
